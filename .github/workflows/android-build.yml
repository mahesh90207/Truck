name: Build Android APK (with SDK install)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install basic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk apt-transport-https ca-certificates

      - name: Download Android commandline tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmd.zip
          unzip -q /tmp/cmd.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          # Move into proper folder name expected by sdkmanager
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest || true
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT --update
        shell: bash

      - name: Install Android SDK platforms and build-tools
        env:
          PATH: ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin:${{ env.PATH }}
        run: |
          # use printf instead of `yes` and force bash shell so sdkmanager runs correctly
          printf 'y\n' | sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          printf 'y\n' | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
        shell: bash

      - name: Ensure gradle available if wrapper missing
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            sudo apt-get install -y gradle
          fi
        shell: bash

      - name: Build Debug APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          PATH: ${{ env.ANDROID_SDK_ROOT }}/platform-tools:${{ env.PATH }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: truck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
